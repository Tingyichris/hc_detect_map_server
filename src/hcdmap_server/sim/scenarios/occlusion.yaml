store_id: store-001
loop_seconds: 90
inject_every_s: [3, 6]
classes: { red: 5, gold: 2, black: 1, green: 4 }

cameras:
  - { id: cam_kitchen, role: source, s_start: 0.00, s_end: 0.06 }
  - { id: cam_t01, role: table, s_start: 0.10, s_end: 0.22 }
  - { id: cam_t02, role: table, s_start: 0.20, s_end: 0.34 }
  - { id: cam_t03, role: table, s_start: 0.34, s_end: 0.48 }
  - { id: cam_t04, role: table, s_start: 0.52, s_end: 0.66 }
  - { id: cam_t05, role: table, s_start: 0.66, s_end: 0.80 }
  - { id: cam_t06, role: table, s_start: 0.80, s_end: 0.96 }

# T03 covers its own camera and takes plates while blind. Detection must still fire via
# cam_t02 (upstream) / cam_t04 (downstream) conservation -> method="occluded_suspect".
pickups:
  - { after_s: 40, table_id: T03 }
  - { after_s: 55, table_id: T03 }

occlusions:
  - { camera_id: cam_t03, at_s: 30, duration_s: 45 }
