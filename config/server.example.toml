# Copy to server.toml. Every key is overridable by env var HCDMAP_<UPPER_KEY>.

store_id = "store-001"

[mqtt]
host = "localhost"
port = 1883
username = ""
password = ""
client_id = "hcdmap-server"

[backend]
url = "http://localhost:8000"
service_token = "dev-service-token"
retry_queue_path = "state/retry_queue.jsonl"
max_retry_queue = 50000

[ws]
host = "0.0.0.0"
port = 8001

[fusion]
# Matching window between adjacent counting lines (seconds), before the estimator adapts it.
match_window_s = 2.0
# Spatial match radius in normalised arc-length (≈ one plate spacing). Tune to real spacing.
match_radius_s = 0.01
# Re-acquire hysteresis: a new `enter` within this time+radius of a just-gone gid = same plate.
reacquire_window_s = 1.5
# Treat a camera with no status message for this long as offline.
camera_offline_after_s = 30
# Max tolerated Pi clock skew before events are quarantined.
max_clock_skew_s = 3.0

[state]
snapshot_path = "state/track.snapshot"
snapshot_interval_s = 10
# On boot, replay this much recent history before trusting counts.
coldstart_replay_s = 180
